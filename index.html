<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貓之家會計系統</title>
<style>
:root{--bg:#f2f4f0;--card:#fff;--tx:#1f2d2b;--mut:#6b7a77;--ac:#2f6f68;--in:#2f7a4f;--out:#b5483f;--warn:#c98a0b;--bd:#dde3de;--hl:#d6eddc;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141c1b;--card:#1d2827;--tx:#e6eeec;--mut:#92a3a0;--ac:#6fc2b8;--in:#6fcf97;--out:#f08a7e;--warn:#e8b64a;--bd:#2e3c3a;--hl:#2b4a41;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 6px;max-width:760px;margin:auto}
h1{font-size:22px;margin:0;letter-spacing:.04em}
h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600}
main{max-width:760px;margin:auto;padding:0 14px}
section{display:none}section.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding-left:10px;padding-right:10px;border:0;background:none;color:var(--mut);padding:12px 0 10px;font:inherit;font-size:12px;position:relative}
nav button.on{background:var(--hl);color:var(--ac);font-weight:700}
nav b{position:absolute;top:6px;margin-left:4px;background:var(--out);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.bal{display:flex;gap:10px;flex-wrap:wrap}
.bal div{flex:1 1 150px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
.bal small{color:var(--mut)}.bal strong{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.item .l{min-width:0}.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--mut);font-size:13px}.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;text-align:right}
.in{color:var(--in)}.out{color:var(--out)}
.late{border-left:5px solid var(--out)}.soon{border-left:5px solid var(--warn)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:5px;padding:0 6px;font-size:12px;margin-right:4px;color:var(--mut)}
button.b,label.b{display:inline-block;border:1px solid var(--ac);background:var(--ac);color:var(--card);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.g,label.g{background:none;color:var(--ac)}button.d{border-color:var(--out);background:none;color:var(--out)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.bar input,.bar select{flex:1 1 110px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);width:min(94vw,460px);padding:16px}
dialog::backdrop{background:#0008}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:20;max-width:90vw}
form label{display:block;font-size:13px;color:var(--mut);margin-top:10px}form input,form select{width:100%;margin-top:2px}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--bd);border-radius:10px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}.cc h3{margin:0 0 4px;font-size:14px}.pie{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.lg{flex:1 1 180px;font-size:13px}.lg div{display:flex;align-items:center;gap:6px;padding:2px 0}.lg i{width:10px;height:10px;border-radius:2px;flex:none}.lg span:nth-child(2){flex:1}.lg span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}.pie1{text-align:center;margin:8px 0 16px}.pie1 svg{display:block;margin:0 auto}.pie1 .lg{max-width:340px;margin:8px auto 0;text-align:left;flex:none}.pie1 h3{margin:0 0 4px}
.cols{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0}.g2 label{font-size:12px;color:var(--mut)}.g2 input{width:100%}.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.hd h3{margin:0}
.chk{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0}.chk label{display:flex;gap:6px;align-items:center}.chk input{width:auto}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header><h1>貓之家會計系統</h1></header>
<main>
<section id="home" class="on"></section>
<section id="rec">
 <div class="bar"><input id="q" placeholder="搜尋項目"><select id="fy"></select><select id="fc"></select><select id="fw"></select></div>
 <div class="row2"><button class="b" data-add="rec">新增記錄</button></div>
 <div id="reclist"></div>
</section>
<section id="ch">
 <div class="bar"><input type="date" id="c1" aria-label="開始日期"><input type="date" id="c2" aria-label="結束日期"></div>
 <div class="row2"><button class="b g" data-p="m">本月</button><button class="b g" data-p="3">近3個月</button><button class="b g" data-p="y">今年</button><button class="b g" data-p="all">全部</button></div>
 <div class="chk"><span style="color:var(--mut)">貨幣</span><label><input type="checkbox" name="cc" value="HKD" checked>HKD</label><label><input type="checkbox" name="cc" value="RMB">RMB</label><label><input type="checkbox" name="cc" value="USD">USD</label></div>
 <div class="chk"><label><input type="checkbox" id="ci">收支圖表包含換匯、借貸、投資本金</label></div>
 <div id="chart"></div>
</section>
<section id="rt"></section>
<section id="due">
 <div class="row2"><button class="b" data-add="due">新增應收應付</button><button class="b g" id="tg">顯示已結清</button></div>
 <div id="duelist"></div>
</section>
<section id="fd">
 <div id="fdsum"></div><div id="fdlist"></div>
 <div class="row2"><button class="b g" id="fdt">顯示已完結</button></div>
 <p style="color:var(--mut);font-size:13px">定期由「記錄」自動整理：存入時新增一筆類型「投資」、項目寫成「Fungi Mox 3mth定期 261105」；取回時項目寫「定期完 261105」；利息另記一筆「定期利息」。</p>
</section>
<section id="set">
 <h2>備份與匯入</h2>
 <div class="row2"><button class="b" id="exj">匯出備份 (JSON)</button><label class="b g">匯入備份 / CSV<input type="file" id="imp" accept=".json,.csv" hidden></label></div>
 <div class="row2"><button class="b g" id="exc">匯出記錄 (CSV)</button><button class="b g" id="ics">匯出到期提醒 (.ics)</button></div>
 <h2>資料放上網站（加密）</h2>
 <div class="row2"><button class="b g" id="enx">匯出加密資料</button><button class="b" id="enl">從網站載入加密資料</button></div>
 <p style="color:var(--mut);font-size:13px">匯出會產生 data.enc，用密碼加密（AES-256）。將它上傳到 GitHub 同一個 repository，姊妹們撳「從網站載入加密資料」並輸入密碼即可。沒有密碼，任何人都看不到內容。</p>
 <h2>其他</h2>
 <div class="row2"><button class="b g" id="seed">載入初始應收項目</button><button class="b d" id="clr">清除本機資料</button></div>
 <p class="s" style="color:var(--mut)">資料只存放在這部裝置的瀏覽器。換手機或電腦前，請先匯出備份。CSV 匯入欄位：日期、項目、類型、分類、經手人、幣種、收入、支出。</p>
</section>
</main>
<nav id="tabs"><button data-t="home" class="on">總覽<b id="cnt0" hidden></b></button><button data-t="rec">記錄</button><button data-t="ch">圖表</button><button data-t="rt">租務</button><button data-t="due">應收應付<b id="cnt" hidden></b></button><button data-t="fd">定期</button><button data-t="set">設定</button></nav>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<dialog id="cf"><form method="dialog"><p id="cm" style="margin-top:0"></p><div class="row2"><button class="b" value="y">確定</button><button class="b g" value="n">取消</button></div></form></dialog>
<div id="toast" hidden></div>
<datalist id="wl"></datalist>
<script>
const CATS=['家用','德昌','婆婆','投資','禮節','聚餐','爸仔','寵物','日常','旅遊','醫療','管理費','電費','煤氣費','水費','舊資料'];
const TYPES=['支出','收入','供款','投資','換匯','借貸'], WHO=['260','Mos','Sugar','Fungi','Yaya'], CUR=['HKD','RMB','USD'];
const RV={'不重複':0,'每月':1,'每2個月':2,'每季':3,'每半年':6,'每年':12},RL={1:'每月',2:'每2個月',3:'每季',6:'每半年',12:'每年'};
const KEY='catHouseLedger.v1';
let S={recs:[],dues:[]}, showDone=false, showFd=false, limit=80;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v)||0, fmt=v=>n(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ask=m=>new Promise(r=>{const d=$('#cf');$('#cm').textContent=m;d.returnValue='';d.onclose=()=>r(d.returnValue==='y');d.showModal()});
const say=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>t.hidden=true,3500)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){say('瀏覽器未能儲存資料，請先匯出備份。')}render()}
const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
const dayDiff=d=>Math.round((new Date(d)-new Date(td()))/864e5);

const dep=u=>S.recs.reduce((t,r)=>r.cur!==u||r.type!=='投資'?t:/定期完/.test(r.item)?t-n(r.inc):/定期/.test(r.item)&&!/利息/.test(r.item)?t+n(r.exp):t,0);
function addM(d,m){const [y,mo,da]=d.split('-').map(Number),t=new Date(Date.UTC(y,mo-1+m,1)),last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(da,last));return t.toISOString().slice(0,10)}
function fixeds(){const R=S.recs,out=[];
 R.forEach((r,i)=>{if(r.type!=='投資'||!(n(r.exp)>0)||/定期完/.test(r.item))return;const m=/定期\s*(\d{6})/.exec(r.item);if(!m)return;
  const code=m[1],mt=/(\d+)\s*mth/i.exec(r.item),mon=mt?+mt[1]:0;let intr=n(r.inc);
  for(let j=i+1;j<R.length;j++){const x=R[j];if(x.date!==r.date||x.cur!==r.cur)break;if(/利息/.test(x.item)){intr+=n(x.inc);break}if(/定期/.test(x.item))break}
  if(!intr&&i>0){const y=R[i-1];if(y.date===r.date&&y.cur===r.cur&&/利息/.test(y.item))intr=n(y.inc)}
  const c=R.find(x=>x.type==='投資'&&n(x.inc)>0&&new RegExp('定期完\\s*'+code).test(x.item));
  out.push({code,who:r.who,cur:r.cur,open:r.date,mon,pr:n(r.exp),intr,mat:mon?addM(r.date,mon):'',done:c?c.date:'',back:c?n(c.inc):0})});
 return out}
function drawFd(){const a=fixeds(),act=a.filter(x=>!x.done).sort((x,y)=>(x.mat||'9')>(y.mat||'9')?1:-1),dn=a.filter(x=>x.done).sort((x,y)=>y.open>x.open?1:-1);
 const tot=CUR.map(u=>[u,act.filter(x=>x.cur===u).reduce((s,x)=>s+x.pr,0)]).filter(x=>x[1]>0);
 $('#fdsum').innerHTML=`<h2>進行中 ${act.length} 張</h2>`+(tot.length?`<div class="bal">${tot.map(([u,v])=>`<div><small>${u} 本金合計</small><strong>${fmt(v)}</strong></div>`).join('')}</div>`:'');
 const card=x=>{const k=x.mat?dayDiff(x.mat):null,st=x.done?'':k===null?'':k<0?'late':k<=14?'soon':'';
  const right=x.done?`已完結<div class="s">${x.done} 取回 ${x.cur} ${fmt(x.back)}</div>`:k===null?'進行中':k<0?`已過到期日 ${-k} 日<div class="s">未記完結</div>`:k===0?'今日到期':`尚有 ${k} 日<div class="s">到期 ${x.mat}</div>`;
  return `<div class="item ${st}" style="cursor:default"><div class="l"><div class="t">${esc(x.who)} ${x.cur} ${fmt(x.pr)}</div><div class="s"><span class="tag">${x.mon?x.mon+' 個月':'期數未知'}</span><span class="tag">${x.code}</span>${x.open} 存入${x.mat?'，到期 '+x.mat:''}</div><div class="s">利息 ${x.intr?fmt(x.intr)+(x.mon?`（年化約 ${(x.intr/x.pr*12/x.mon*100).toFixed(2)}%）`:''):'未有記錄'}</div></div><div class="amt" style="font-weight:600">${right}</div></div>`};
 $('#fdlist').innerHTML=(act.length?act.map(card).join(''):'<div class="empty">冇進行中嘅定期</div>')+(showFd?'<h2>已完結</h2>'+(dn.length?dn.map(card).join(''):'<div class="empty">未有已完結定期</div>'):'');
 $('#fdt').textContent=showFd?'隱藏已完結':'顯示已完結（'+dn.length+'）'}
const PAL=['#2f6f68','#c98a0b','#b5483f','#5b7fb5','#8a6bb0','#6aa84f','#d17a9a','#8c8c8c'];
const real=r=>!['換匯','借貸','投資'].includes(r.type);
const short=v=>{const a=Math.abs(v),x=a>=1e6?(a/1e6).toFixed(1).replace(/\.0$/,'')+'M':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'k':a.toFixed(0);return(v<0?'-':'')+x};
const niceMax=m=>{const e=Math.pow(10,Math.floor(Math.log10(m))),f=m/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e};
const tx=(x,y,t,a)=>`<text x="${x}" y="${y}" text-anchor="${a||'middle'}" font-size="10" style="fill:var(--mut)">${esc(t)}</text>`;
const gl=(L,W,y)=>`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--bd)"/>`;
const CC={HKD:'#2f6f68',RMB:'#c98a0b',USD:'#5b7fb5'};
function barSvg(rows,us){const W=640,H=240,L=46,R=8,T=12,B=26,pw=W-L-R,ph=H-T-B,one=us.length===1,mx=niceMax(Math.max(1,...rows.flatMap(r=>us.flatMap(u=>[r.d[u].inc,r.d[u].exp]))));let g='';
 for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=gl(L,W-R,y)+tx(L-6,y+3,short(mx*i/4),'end')}
 const bw=pw/rows.length,nb=us.length*2,w=Math.max(2,Math.min(16,bw*.8/nb)),st=Math.ceil(rows.length/Math.floor(pw/44));
 rows.forEach((r,i)=>{const cx=L+bw*i+bw/2;let x=cx-nb*w/2;
  us.forEach(u=>[['inc','in'],['exp','out']].forEach(([k,c])=>{const h=ph*r.d[u][k]/mx,col=one?`var(--${c})`:CC[u];
   g+=`<rect x="${x}" y="${T+ph-h}" width="${w}" height="${h}" style="fill:${col}${k==='exp'&&!one?';fill-opacity:.3;stroke:'+col:''}"/>`;x+=w}));
  g+=`<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${ph}" fill="transparent"><title>${r.label}${us.map(u=>`\n${u} 收入 ${fmt(r.d[u].inc)}　支出 ${fmt(r.d[u].exp)}`).join('')}</title></rect>`;
  if(i%st===0)g+=tx(cx,H-8,r.label)});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="收支棒形圖">${g}</svg>`}
function lineSvg(se,lb){const W=640,H=230,L=52,R=14,T=12,B=26,pw=W-L-R,ph=H-T-B,N=lb.length,vs=se.flatMap(q=>q.v);
 let lo=Math.min(...vs),hi=Math.max(...vs);if(hi===lo){hi+=1;lo-=1}const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
 const X=i=>N===1?L+pw/2:L+pw*i/(N-1),Y=v=>T+ph-ph*(v-lo)/(hi-lo);let g='';
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=gl(L,W-R,Y(v))+tx(L-6,Y(v)+3,short(v),'end')}
 if(lo<0&&hi>0)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke-dasharray="4 3" style="stroke:var(--mut)"/>`;
 const st=Math.ceil(N/Math.floor(pw/50));lb.forEach((l,i)=>{if(i%st===0)g+=tx(X(i),H-8,l)});
 se.forEach(q=>{const d=q.v.map((v,i)=>`${i?'L':'M'}${X(i)} ${Y(v)}`).join('');
  if(se.length===1&&N>1)g+=`<path d="${d}V${T+ph}H${X(0)}Z" style="fill:${q.col}" opacity=".13"/>`;
  g+=`<path d="${d}" fill="none" stroke-width="2" style="stroke:${q.col}"/>`;
  q.v.forEach((v,i)=>g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" style="fill:${q.col}"><title>${lb[i]}　${q.name} ${fmt(v)}</title></circle>`)});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="結餘折線圖">${g}</svg>`}
function donutSvg(sl,tot){const c=135,R=126,r=78;let a=-Math.PI/2,g='';
 sl.forEach((s,i)=>{const f=s.v/tot,b=a+f*2*Math.PI,col=PAL[i%8];
  if(f>=.9999)g+=`<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`;
  else{const p=(q,t)=>[c+q*Math.cos(t),c+q*Math.sin(t)],[x1,y1]=p(R,a),[x2,y2]=p(R,b),[x3,y3]=p(r,b),[x4,y4]=p(r,a),l=f>.5?1:0;
   g+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${l} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${l} 0 ${x4} ${y4}Z" fill="${col}"><title>${esc(s.k)} ${fmt(s.v)}</title></path>`}
  a=b});
 return`<svg viewBox="0 0 270 270" width="270" height="270" style="max-width:100%;height:auto" role="img" aria-label="支出類別圓形圖">${g}<text x="${c}" y="${c-2}" text-anchor="middle" font-size="14" style="fill:var(--mut)">支出合計</text><text x="${c}" y="${c+22}" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--tx)">${short(tot)}</text></svg>`}
function preset(p){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),z=x=>new Date(Date.UTC(y,x,1)).toISOString().slice(0,10);
 $('#c1').value=p==='m'?z(m):p==='3'?z(m-2):p==='y'?`${y}-01-01`:'';$('#c2').value=p==='all'?'':td();drawCh()}
function mons(a,b){let[y,m]=a.split('-').map(Number);const ey=+b.slice(0,4),em=+b.slice(5,7),o=[];while(y<ey||(y===ey&&m<=em)){o.push(`${y}-${String(m).padStart(2,'0')}`);if(++m>12){m=1;y++}}return o}
function drawCh(){const f=$('#c1').value,t=$('#c2').value,incl=$('#ci').checked,sel=[...document.querySelectorAll('[name=cc]:checked')].map(x=>x.value),cmp=(a,b)=>a.date>b.date?1:a.date<b.date?-1:0,box=$('#chart');

  h=field('dir','方向','sel',d.dir,['應收','應付'])+field('who','對象','text',d.who)+field('item','項目','text',d.item)+field('amt','金額','number',d.amt)+field('cur','幣種','sel',d.cur,CUR)+field('due','到期日','date',d.due)+field('rep','重複（完成後自動建立下一期，需填到期日）','sel',RL[d.rep]||'不重複',Object.keys(RV))+field('cat','分類','sel',d.cat,['',...CATS])+field('note','備註','text',d.note)+(d.status.startsWith('已')?field('paidDate','收款／付款日期','date',d.paidDate||''):'')}
 const f=$('#frm');
 f.innerHTML=`<h2 style="margin-top:0;color:var(--tx)">${o?'編輯':'新增'}${isRec?'記錄':'應收應付'}</h2>${h}<div class="row2" style="margin-top:16px"><button class="b" value="ok">儲存</button><button class="b g" value="x" formnovalidate>取消</button>${o?'<button class="b d" value="del" formnovalidate>刪除</button>':''}</div>`;
 f.onsubmit=e=>{const v=e.submitter&&e.submitter.value;if(v==='x')return;const fd=Object.fromEntries(new FormData(f));
  if(v==='del'){ask('確定刪除？').then(ok=>{if(!ok)return;const a=isRec?S.recs:S.dues;a.splice(a.findIndex(x=>x.id===id),1);save();say('已刪除')});return}
  if(isRec){const a=n(fd.amt);const r={id:o?o.id:uid(),date:fd.date,item:fd.item.trim(),type:fd.type,cat:fd.cat,who:fd.who.trim(),cur:fd.cur,inc:fd.dir==='收入'?a:0,exp:fd.dir==='支出'?a:0};
   o?Object.assign(o,r):S.recs.push(r)}
  else{if((RV[fd.rep]||0)>0&&!fd.due){e.preventDefault();say('重複項目請填到期日');return}const d={id:o?o.id:uid(),dir:fd.dir,who:fd.who.trim(),item:fd.item.trim(),amt:n(fd.amt),cur:fd.cur,due:fd.due,cat:fd.cat,note:fd.note.trim(),rep:RV[fd.rep]||0,status:o?o.status:(fd.dir==='應收'?'未收':'未付'),paidDate:fd.paidDate||(o&&o.paidDate)||'',recId:o&&o.recId};
   o?Object.assign(o,d):S.dues.push(d);
   if(o&&o.recId){const r=S.recs.find(x=>x.id===o.recId);if(r){if(o.paidDate)r.date=o.paidDate;r.inc=o.dir==='應收'?n(o.amt):0;r.exp=o.dir==='應付'?n(o.amt):0;r.cat=o.cat;r.item=`${o.who} ${o.item}`.trim()}}}
  save()};
 const sel=f.elements.dir,ty=f.elements.type;
 if(isRec)sel.onchange=()=>{if(['收入','支出'].includes(ty.value))ty.value=sel.value};
 $('#dlg').showModal();
}
function openDone(id){const d=S.dues.find(x=>x.id===id);if(!d)return;const w=d.dir==='應收'?'已收':'已付',f=$('#frm');
 f.innerHTML=`<h2 style="margin-top:0;color:var(--tx)">標記為${w}</h2><p style="margin:0;color:var(--mut)">${esc(d.who)} ${esc(d.item)}</p>`+field('date',d.dir==='應收'?'收款日期':'付款日期','date',d.paidDate||td())+field('amt','實際金額','number',d.amt||'')+`<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="rec" checked style="width:auto"> 同時記入收支記錄</label><div class="row2" style="margin-top:16px"><button class="b" value="ok">儲存</button><button class="b g" value="x" formnovalidate>取消</button></div>`;
 f.onsubmit=e=>{const v=e.submitter&&e.submitter.value;if(v==='x')return;const fd=Object.fromEntries(new FormData(f));
  const was=d.status.startsWith('已');d.status=w;d.paidDate=fd.date;if(n(fd.amt))d.amt=n(fd.amt);let m=`已標記為${w}`;
  if(!was){const rm=S.rent.rooms.find(x=>x.pre&&d.who==='德昌 '+x.n&&/水電儲值/.test(d.item));if(rm){rm.bal=+(n(rm.bal)+n(d.amt)).toFixed(2);lgR(rm,'儲值',n(d.amt),fd.date)}}
  if(fd.rec&&d.amt&&!d.recId){const r={id:uid(),date:fd.date,item:`${d.who} ${d.item}`.trim(),type:d.dir==='應收'?'收入':'支出',cat:d.cat,who:WHO.includes(d.who)?d.who:(d.cat==='德昌'?'Fungi':''),cur:d.cur,inc:d.dir==='應收'?n(d.amt):0,exp:d.dir==='應付'?n(d.amt):0};S.recs.push(r);d.recId=r.id;m=`已記入收支：${r.item} ${r.cur} ${fmt(d.amt)}（${r.date}）`}
  if(!was&&d.rep>0){const nd=addM(d.due||fd.date,d.rep),ni=shiftItem(d.item,d.rep);
   if(!S.dues.some(x=>x.who===d.who&&x.item===ni&&x.due===nd&&!x.status.startsWith('已')))S.dues.push({...d,id:uid(),item:ni,due:nd,status:d.dir==='應收'?'未收':'未付',paidDate:'',recId:undefined});m+=`；已建立下一期（到期 ${nd}）`}
  save();say(m)};
 $('#dlg').showModal()}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x))rows.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
function importCSV(t){const rows=parseCSV(t),h=rows.shift().map(x=>x.trim());const ix=k=>h.findIndex(x=>x===k||x.startsWith(k));
 const m={date:ix('日期'),item:ix('項目'),type:ix('類型'),cat:ix('分類'),who:ix('經手人'),cur:ix('幣種'),inc:ix('收入'),exp:ix('支出')};
 if(m.date<0||m.item<0){say('CSV 缺少「日期」或「項目」欄。');return}
 let k=0;rows.forEach(r=>{const d=(r[m.date]||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
  const g=i=>i<0?'':(r[i]||'').trim(),inc=n(g(m.inc).replace(/,/g,'')),exp=n(g(m.exp).replace(/,/g,''));
  S.recs.push({id:uid(),date:d,item:g(m.item),type:g(m.type)||(inc?'收入':'支出'),cat:g(m.cat),who:g(m.who),cur:g(m.cur)||'HKD',inc,exp});k++});
 save();say(`已匯入 ${k} 筆記錄。`)}
function ics(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CatHouse//ZH'];
 S.dues.filter(d=>d.due&&!d.status.startsWith('已')).forEach(d=>{const x=d.due.replace(/-/g,'');
  L.push('BEGIN:VEVENT','UID:'+d.id+'@cathouse','DTSTAMP:'+x+'T000000Z','DTSTART;VALUE=DATE:'+x,'SUMMARY:'+`${d.dir} ${d.who} ${d.item} ${d.amt?d.cur+d.amt:''}`.replace(/[,;\n]/g,' '),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:到期提醒','END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');if(L.length<5)return say('冇設定到期日嘅未結清項目。');dl('應收應付提醒.ics',L.join('\r\n'),'text/calendar')}

document.addEventListener('click',async e=>{const t=e.target.closest('button,.item');if(!t)return;
 if(t.dataset.t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t.dataset.t));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===t));scrollTo(0,0);return}
 if(t.dataset.p)return preset(t.dataset.p);
 if(t.dataset.re!==undefined)return openRt('r',+t.dataset.re);
 if(t.dataset.ce!==undefined)return openRt('c',+t.dataset.ce);
 if(t.dataset.rp!==undefined)return roomRemind(+t.dataset.rp);
 if(t.dataset.cp!==undefined)return costRemind(+t.dataset.cp);
 if(t.dataset.pay!==undefined)return payRent(+t.dataset.pay);
 if(t.dataset.cpay!==undefined)return payCost(+t.dataset.cpay);
 if(t.dataset.wa!==undefined)return addUtil(+t.dataset.wa);
 if(t.dataset.wu!==undefined)return addUse(+t.dataset.wu);
 if(t.dataset.tp!==undefined)return topUp(+t.dataset.tp);
 if(t.dataset.tr!==undefined)return topRemind(+t.dataset.tr);
 if(t.dataset.go)return document.querySelector(`#tabs [data-t=${t.dataset.go}]`).click();
 if(t.dataset.add)return openForm(t.dataset.add);
 if(t.dataset.done)return openDone(t.dataset.done);
 if(t.dataset.edit)return openForm(t.dataset.edit,t.dataset.id);
 if(t.id==='more'){limit+=80;drawRec()}
 if(t.id==='tg'){showDone=!showDone;drawDue()}
 if(t.id==='fdt'){showFd=!showFd;drawFd()}
 if(t.id==='exj')dl('貓之家備份.json',JSON.stringify(S),'application/json');
 if(t.id==='exc')dl('貓之家記錄.csv','\uFEFF日期,項目,類型,分類,經手人,幣種,收入,支出\n'+S.recs.map(r=>[r.date,r.item,r.type,r.cat,r.who,r.cur,r.inc||'',r.exp||''].map(csvq).join(',')).join('\n'),'text/csv');
 if(t.id==='ics')ics();
 if(t.id==='enx'){const pw=await askPw('設定加密密碼',true);if(!pw)return;try{dl('data.enc',await enc(pw),'text/plain');say('已匯出 data.enc，請上傳到 GitHub repository')}catch(e){say('加密失敗')}}
 if(t.id==='enl')loadEnc();
 if(t.id==='seed'){if(S.dues.length&&!await ask('已有應收應付項目，仍要加入初始項目？'))return;
  [['應收','Yaya','家用供款 2026-07 至 2026-11',5000,'家用'],['應收','Mos','家用供款 2026-10 至 2026-12',3000,'家用'],['應收','德昌 Rm3','租金 11月份',4639,'德昌'],['應收','Mos','借款（2026-08-12）',60000,'']]
  .forEach(([dir,who,item,amt,cat])=>S.dues.push({id:uid(),dir,who,item,amt,cur:'HKD',due:'',cat,note:'',status:'未收'}));save()}
 if(t.id==='clr'&&await ask('會清除這部裝置上所有記錄，請確定已匯出備份。')&&await ask('再確認一次：真的清除？')){S={recs:[],dues:[]};save()}
});
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{
 try{if(f.name.endsWith('.json')){const j=JSON.parse(rd.result);if(!Array.isArray(j.recs)||!Array.isArray(j.dues))throw 0;if(!await ask('匯入備份會取代目前所有資料，繼續？'))return;S=j;save();say('已匯入備份。')}else importCSV(rd.result)}catch(x){say('檔案格式唔正確。')}};rd.readAsText(f);e.target.value=''};
['q','fy','fc','fw'].forEach(i=>$('#'+i).addEventListener('input',()=>{limit=80;drawRec()}));
let lastDay=td();setInterval(()=>{if(td()!==lastDay){lastDay=td();render()}},6e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastDay=td();render()}});
load();
$('#ch').addEventListener('input',drawCh);
$('#rt').addEventListener('input',e=>{if(e.target.dataset.u!==undefined)calcU(+e.target.dataset.u)});
preset('y');if(!S.recs.some(r=>r.date.startsWith(String(new Date().getFullYear()))))preset('all');
render();
